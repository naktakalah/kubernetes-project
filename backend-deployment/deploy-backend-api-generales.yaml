apiVersion: apps/v1
kind: Deployment
metadata:
  name: generales-deployment
  labels:
    entorno: produccion
    app: backend
spec:
  selector:
    matchLabels:
      app: generales-backend
  template:
    metadata:
      labels:
        app: generales-backend
    spec:
      containers:
      - name: generales-backend
        image: devsendit/sendit-prod:api_backend_generales
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        env:
          - name: APP_PORT
            value: "4500"
        ports:
        - containerPort: 4500
          volumeMounts:
            - name: generales-config
              mountPath: /app/.env
              subPath: .env
      volumes:
        - name: generales-config
          secret:
            secretName: backend-secret
      imagePullSecrets:
      - name: hub-sendit