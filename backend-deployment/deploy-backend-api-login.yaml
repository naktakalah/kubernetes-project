apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-deployment
  labels:
    entorno: produccion
    app: backend
spec:
  selector:
    matchLabels:
      app: login-backend
  template:
    metadata:
      labels:
        app: login-backend
    spec:
      containers:
        - name: login-backend
          image: devsendit/sendit-prod:api_backend_login
          # resources:
          #   limits:
          #     memory: "128Mi"
          #     cpu: "500m"
          env:
            - name: APP_PORT
              value: "4300"
            - name: NAME_APP
              value: "loginApi"
          ports:
            - containerPort: 4300
          volumeMounts:
            - name: login-config
              mountPath: /app/.env
              subPath: .env
      volumes:
        - name: login-config
          secret:
            secretName: backend-secret-global
      imagePullSecrets:
        - name: hub-sendit