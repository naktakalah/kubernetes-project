apiVersion: apps/v1
kind: Deployment
metadata:
  name: corresponsal-deployment
  labels:
    entorno: produccion
    app: backend
spec:
  selector:
    matchLabels:
      app: corresponsal-backend
  template:
    metadata:
      labels:
        app: corresponsal-backend
    spec:
      containers:
      - name: corresponsal-backend
        image: devsendit/sendit-prod:api_backend_corresponsal
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        env:
          - name: APP_PORT
            value: "4600"
        ports:
        - containerPort: 4600
          volumeMounts:
            - name: corresponsal-config
              mountPath: /app/.env
              subPath: .env
      volumes:
        - name: corresponsal-config
          secret:
            secretName: backend-secret
      imagePullSecrets:
      - name: hub-sendit