apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-deployment
  labels:
    entorno: produccion
    app: backend
spec:
  selector:
    matchLabels:
      app: email-backend
  template:
    metadata:
      labels:
        app: email-backend
    spec:
      containers:
      - name: email-backend
        image: devsendit/sendit-prod:api_backend_email
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        env:
          - name: APP_PORT
            value: "4400"
          - name: NAME_APP
            value: "emailApi"
        ports:
        - containerPort: 4400
        volumeMounts:
          - name: email-config
            mountPath: /app/.env
            subPath: .env
      volumes:
        - name: email-config
          secret:
            secretName: backend-secret-global
      imagePullSecrets:
      - name: hub-sendit