apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-deployment
  labels:
    entorno: produccion
    app: backend
spec:
  selector:
    matchLabels:
      app: legacy-backend
  template:
    metadata:
      labels:
        app: legacy-backend
    spec:
      containers:
      - name: legacy-backend
        image: devsendit/sendit-prod:api_backend_legacy
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        env:
          - name: APP_PORT
            value: "4800"
          - name: NAME_APP
            value: "legacyApi"
        ports:
        - containerPort: 4800
        volumeMounts:
          - name: legacy-config
            mountPath: /app/.env
            subPath: .env
      volumes:
        - name: legacy-config
          secret:
            secretName: backend-secret-global
      imagePullSecrets:
      - name: hub-sendit