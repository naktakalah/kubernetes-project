apiVersion: apps/v1
kind: Deployment
metadata:
  name: compra-deployment
  labels:
    entorno: produccion
    app: backend
spec:
  selector:
    matchLabels:
      app: compra-backend
  template:
    metadata:
      labels:
        app: compra-backend
    spec:
      containers:
      - name: compra-backend
        image: devsendit/sendit-prod:api_backend_compra
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        env:
          - name: APP_PORT
            value: "4700"
        ports:
        - containerPort: 4700
          volumeMounts:
            - name: compra-config
              mountPath: /app/.env
              subPath: .env
      volumes:
        - name: compra-config
          secret:
            secretName: backend-secret
      imagePullSecrets:
      - name: hub-sendit