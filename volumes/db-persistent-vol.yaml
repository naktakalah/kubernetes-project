apiVersion: v1
kind: PersistentVolume
metadata:
  name: db-persistent-vol
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Gi
  local:
    path: /media/persistent_vol
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  volumeMode: Filesystem
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - vm-test

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-persistent-vc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: db-persistent-vol
  storageClassName: "local-storage"  

